name: Build RJ Tech India APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/rjtechindia/app

          echo "pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'RJTechIndia'
          include ':app'" > settings.gradle

          echo "plugins {
            id 'com.android.application' version '8.5.2' apply false
          }" > build.gradle

          echo "plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.rjtechindia.app'
            compileSdk 35

            defaultConfig {
              applicationId 'com.rjtechindia.app'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
            }
          }" > app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="RJ Tech India"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rjtechindia/app/MainActivity.java <<'EOF'
          package com.rjtechindia.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);

              WebView w = new WebView(this);
              w.setWebViewClient(new WebViewClient());

              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);

              setContentView(w);
              w.loadUrl("https://techguruindia-deals.blogspot.com/");
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Tech-India-APK
          path: app/build/outputs/apk/debug/app-debug.apk
